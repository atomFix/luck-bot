<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <style>text{font-family:'PingFang SC','Helvetica Neue',sans-serif;fill:#242629}.name{font-size:18px;font-weight:600}.hint{font-size:13px;fill:#727777}.caption{font-size:15px}.eye{fill:#f5f2e9}</style>
    <path id="body" d="M-65,19 C-67,-9 -48,-48 -20,-51 C2,-58 20,-48 32,-43 C55,-32 69,-6 66,20 C64,48 34,55 0,53 C-34,57 -62,47 -65,19Z"/>
    <g id="screen"><circle r="124" fill="#dcded9"/><circle r="120" fill="#f5f2e9"/><ellipse cy="55" rx="47" ry="7" fill="#16191b" opacity=".10"/></g>
    <g id="neutral"><rect class="eye" x="-33" y="-13" width="16" height="28" rx="8"/><rect class="eye" x="17" y="-13" width="16" height="28" rx="8"/></g>
  </defs>
  <rect width="1000" height="1000" fill="#eceee9"/>
  <text x="46" y="48" font-size="25" font-weight="650">小智 · 黑白软团子</text>
  <text x="46" y="75" font-size="14" fill="#727777">240 × 240 圆屏角色方向 · 原创造型 · 静态关键姿态，非动画或设备性能演示</text>
  <g transform="translate(175 275)">
    <use href="#screen"/>
    <g transform="translate(0 -9)" fill="#171a1c"><use href="#body"/><use href="#neutral"/></g>
    <text text-anchor="middle" y="88" class="caption">我在这里</text>
    <text text-anchor="middle" y="158" class="name">待机 · 慢慢呼吸</text>
    <text text-anchor="middle" y="181" class="hint">眨眼、偶尔左右看看</text>
  </g>
  <g transform="translate(500 275)">
    <use href="#screen"/>
    <g transform="translate(0 -14) rotate(-5) scale(.96 1.06)" fill="#171a1c"><use href="#body"/>
      <rect class="eye" x="-34" y="-19" width="18" height="36" rx="9"/><rect class="eye" x="17" y="-20" width="18" height="37" rx="9"/>
    </g>
    <text text-anchor="middle" y="88" class="caption">嗯，我在听</text>
    <text text-anchor="middle" y="158" class="name">聆听 · 认真靠近</text>
    <text text-anchor="middle" y="181" class="hint">睁大眼睛、轻轻点头</text>
  </g>
  <g transform="translate(825 275)">
    <use href="#screen"/>
    <g transform="translate(0 -8) rotate(9)" fill="#171a1c"><use href="#body"/>
      <path class="eye" d="M-37,-16 Q-27,-23 -17,-16 L-17,0 Q-27,9 -37,0Z"/><rect class="eye" x="17" y="-22" width="17" height="31" rx="8"/>
    </g>
    <g fill="#171a1c"><circle cx="-12" cy="83" r="3"/><circle cy="83" r="3" opacity=".5"/><circle cx="12" cy="83" r="3" opacity=".22"/></g>
    <text text-anchor="middle" y="158" class="name">思考 · 等一下下</text>
    <text text-anchor="middle" y="181" class="hint">歪头、眼神往上、小点轮流亮</text>
  </g>
  <g transform="translate(175 700)">
    <use href="#screen"/>
    <g transform="translate(0 -8) scale(1.05 .93)" fill="#171a1c"><use href="#body"/>
      <path d="M-38,3 Q-27,-18 -16,3 M16,3 Q27,-18 38,3" fill="none" stroke="#f5f2e9" stroke-width="9" stroke-linecap="round"/>
    </g>
    <text text-anchor="middle" y="88" class="caption">见到你很开心</text>
    <text text-anchor="middle" y="158" class="name">开心 · 小小弹一下</text>
    <text text-anchor="middle" y="181" class="hint">笑眼、身体压扁再回弹</text>
  </g>
  <g transform="translate(500 700)">
    <use href="#screen"/>
    <g transform="translate(0 -17) rotate(-3) scale(.93 1.08)" fill="#171a1c"><use href="#body"/>
      <ellipse class="eye" cx="-25" cy="-5" rx="12" ry="20"/><ellipse class="eye" cx="25" cy="-5" rx="12" ry="20"/>
    </g>
    <path d="M-85,-37 L-94,-46 M82,-40 L91,-49" stroke="#171a1c" stroke-width="4" stroke-linecap="round"/>
    <text text-anchor="middle" y="88" class="caption">哇，真的吗</text>
    <text text-anchor="middle" y="158" class="name">惊讶 · 瞬间抬起来</text>
    <text text-anchor="middle" y="181" class="hint">双眼放大、短暂停住、柔和回落</text>
  </g>
  <g transform="translate(825 700)">
    <use href="#screen"/>
    <g transform="translate(0 1) rotate(4) scale(1.05 .87)" fill="#171a1c"><use href="#body"/>
      <path d="M-37,0 Q-26,8 -15,0 M15,0 Q26,8 37,0" fill="none" stroke="#f5f2e9" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="61" y="-42" font-size="20" font-weight="600" fill="#777c7c">z</text><text x="78" y="-61" font-size="14" fill="#777c7c">z</text>
    <text text-anchor="middle" y="88" class="caption">陪你安静一会儿</text>
    <text text-anchor="middle" y="158" class="name">困倦 · 慢慢眯起来</text>
    <text text-anchor="middle" y="181" class="hint">低频呼吸、眼皮渐沉</text>
  </g>
</svg>
