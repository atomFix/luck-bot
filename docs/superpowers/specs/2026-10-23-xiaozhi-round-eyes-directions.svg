<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <style>text{font-family:'PingFang SC','Helvetica Neue',sans-serif;fill:#242629}.name{font-size:18px;font-weight:600}.hint{font-size:13px;fill:#727777}.eye{fill:#f3f2ed}.lid{fill:none;stroke:#f3f2ed;stroke-linecap:round}</style>
    <g id="face"><circle r="104" fill="#d5d8d5"/><circle r="100" fill="#050607"/></g>
    <g id="open"><rect class="eye" x="-48" y="-24" width="24" height="48" rx="12"/><rect class="eye" x="24" y="-24" width="24" height="48" rx="12"/></g>
  </defs>
  <rect width="1000" height="1000" fill="#eceee9"/>
  <text x="46" y="48" font-size="25" font-weight="650">小智 · 一张圆脸，一双眼睛</text>
  <text x="46" y="75" font-size="14">整块圆屏就是脸 · 圆形保持固定 · 表情只由双眼表达 · 静态眼型设计稿</text>
  <g transform="translate(175 215)">
    <use href="#face"/><use href="#open"/>
    <text text-anchor="middle" y="137" class="name">待机</text>
    <text text-anchor="middle" y="160" class="hint">自然眨眼，偶尔看看旁边</text>
  </g>
  <g transform="translate(500 215)">
    <use href="#face"/>
    <rect class="eye" x="-49" y="-32" width="26" height="64" rx="13"/><rect class="eye" x="23" y="-32" width="26" height="64" rx="13"/>
    <text text-anchor="middle" y="137" class="name">认真聆听</text>
    <text text-anchor="middle" y="160" class="hint">双眼睁高，目光停在中央</text>
  </g>
  <g transform="translate(825 215)">
    <use href="#face"/>
    <path class="eye" d="M-48,-28 Q-35,-34 -22,-25 L-22,-3 Q-35,6 -48,-3Z"/><rect class="eye" x="24" y="-38" width="25" height="50" rx="12"/>
    <text text-anchor="middle" y="137" class="name">思考</text>
    <text text-anchor="middle" y="160" class="hint">目光上移，一只眼稍稍眯起</text>
  </g>
  <g transform="translate(175 515)">
    <use href="#face"/>
    <path class="lid" stroke-width="10" d="M-54,8 Q-36,-23 -18,8 M18,8 Q36,-23 54,8"/>
    <text text-anchor="middle" y="137" class="name">开心</text>
    <text text-anchor="middle" y="160" class="hint">弯弯笑眼，轻轻开合</text>
  </g>
  <g transform="translate(500 515)">
    <use href="#face"/>
    <path class="eye" d="M-53,-12 Q-37,-7 -21,-15 L-21,4 Q-36,16 -53,5Z"/><rect class="eye" x="23" y="-27" width="27" height="54" rx="13"/>
    <text text-anchor="middle" y="137" class="name">疑惑</text>
    <text text-anchor="middle" y="160" class="hint">左右不对称，侧眼确认一下</text>
  </g>
  <g transform="translate(825 515)">
    <use href="#face"/>
    <path class="eye" d="M-58,-22 Q-38,-18 -17,-3 L-17,16 Q-37,25 -54,14 Q-60,5 -58,-22Z M58,-22 Q38,-18 17,-3 L17,16 Q37,25 54,14 Q60,5 58,-22Z"/>
    <text text-anchor="middle" y="137" class="name">生气</text>
    <text text-anchor="middle" y="160" class="hint">上眼睑压低，眼型向内倾斜</text>
  </g>
  <g transform="translate(175 815)">
    <use href="#face"/>
    <ellipse class="eye" cx="-36" rx="17" ry="35"/><ellipse class="eye" cx="36" rx="17" ry="35"/>
    <text text-anchor="middle" y="137" class="name">惊讶</text>
    <text text-anchor="middle" y="160" class="hint">突然睁大，短暂停留再回落</text>
  </g>
  <g transform="translate(500 815)">
    <use href="#face"/>
    <path class="eye" d="M-50,-6 Q-36,-10 -22,-24 L-22,14 Q-36,28 -50,14Z"/>
    <path class="eye" d="M50,-6 Q36,-10 22,-24 L22,14 Q36,28 50,14Z"/>
    <text text-anchor="middle" y="137" class="name">委屈</text>
    <text text-anchor="middle" y="160" class="hint">眼睑内侧抬高，缓慢眨眼</text>
  </g>
  <g transform="translate(825 815)">
    <use href="#face"/>
    <path class="lid" stroke-width="6" d="M-55,0 Q-37,13 -19,0 M19,0 Q37,13 55,0"/>
    <text text-anchor="middle" y="137" class="name">困倦</text>
    <text text-anchor="middle" y="160" class="hint">眼皮渐渐沉下，最后合上</text>
  </g>
</svg>
